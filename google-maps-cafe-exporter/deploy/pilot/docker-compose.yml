name: fastmenu-pilot

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/pilot/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3210"
      BIND_HOST: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=320
      PILOT_MODE: "1"
      PILOT_PUBLIC_HOSTS: ${PILOT_PUBLIC_HOSTS:?PILOT_PUBLIC_HOSTS is required}
      PILOT_CLIENT_HOSTS: ${PILOT_CLIENT_HOSTS:?PILOT_CLIENT_HOSTS is required}
      PILOT_OPERATOR_HOSTS: ${PILOT_OPERATOR_HOSTS:-}
      PILOT_SITE_DOMAIN: ${PILOT_SITE_DOMAIN:?PILOT_SITE_DOMAIN is required}
      PUBLIC_MENU_ORIGIN: ${PUBLIC_MENU_ORIGIN:?PUBLIC_MENU_ORIGIN is required}
      PUBLISH_API_TOKEN: ${PUBLISH_API_TOKEN:?PUBLISH_API_TOKEN is required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      OPS_SESSION_SECRET: ${OPS_SESSION_SECRET:-}
      OPS_EMAIL: ${OPS_EMAIL:-}
      OPS_PASSWORD: ${OPS_PASSWORD:-}
      SITE_ADMIN_CREDENTIALS_KEY: ${SITE_ADMIN_CREDENTIALS_KEY:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
    volumes:
      - app_data:/app/data
      - client_uploads:/app/public/uploads/client-admin
    restart: unless-stopped
    # This VPS also hosts existing production services. The pilot runs no
    # Playwright/OCR jobs, so keep a firm ceiling and leave headroom for them.
    mem_limit: 450m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

volumes:
  app_data:
  client_uploads:
