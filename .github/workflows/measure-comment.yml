name: Measure transfer comment

on:
  push:
    paths:
      - .github/workflows/measure-comment.yml

permissions:
  issues: write
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const { data } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: 5314215425,
            });
            const body = data.body || '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `MEASURE length=${body.length} bytes=${Buffer.byteLength(body, 'utf8')} sha256=${crypto.createHash('sha256').update(body).digest('hex')}`,
            });
